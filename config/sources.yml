  - id: hh_ekb_cpp
    kind: hh_rss
    priority: 15
    url: https://hh.ru/search/vacancy/rss?text=c%2B%2B&area=3&professional_role=96&order_by=publication_time
    tags: [it, ru, ekb]

  - id: hh_ekb_qa
    kind: hh_rss
    priority: 15
    url: https://hh.ru/search/vacancy/rss?text=qa&area=3&professional_role=124&order_by=publication_time
    tags: [it, ru, ekb, qa]

  # --- hh.ru, удалённо по РФ (area=113 + work_format=REMOTE) ------------------
  # work_format is absent from the RSS summary, so it comes from `defaults`.
  - id: hh_remote_python
    kind: hh_rss
    priority: 15
    url: https://hh.ru/search/vacancy/rss?text=python&area=113&work_format=REMOTE&professional_role=96&order_by=publication_time
    defaults: {work_format: remote}
    tags: [it, ru, remote]

  - id: hh_remote_javascript
    kind: hh_rss
    priority: 15
    url: https://hh.ru/search/vacancy/rss?text=javascript&area=113&work_format=REMOTE&professional_role=96&order_by=publication_time
