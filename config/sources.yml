# Vacancy sources.
#
# kind: feed    - RSS/Atom, parsed by the generic feed adapter
# kind: hh_rss  - hh.ru search RSS: same as feed, plus labelled summary parsing
#                 (company / region / salary). No app or token needed - api.hh.ru
#                 answers 403 anonymously, the RSS search does not.
# kind: jsonapi - JSON API with dot-path mapping (added for hh / Trudvsem / ATS next)
# kind: fake    - synthetic data, used for demos and offline tests
#
# priority: lower wins when the same vacancy comes from several sources.
#   10 - company career page / ATS (first hand)
#   15 - first hand board API/RSS (hh.ru)
#   20 - curated job boards (Habr Career)
#   30 - aggregators (Geekjob, Djinni)
#   50 - unknown
#
# Filters (Ekb + remote) are applied on top of these feeds in config/filters.yml.

sources:
  # --- hh.ru, Екатеринбург (area=3) -------------------------------------------
  # professional_role 96 = Программист, разработчик; 124 = Тестировщик.
  # order_by=publication_time keeps the feed to the newest 20 postings.
  - id: hh_ekb_python
    kind: hh_rss
    priority: 15
    url: https://hh.ru/search/vacancy/rss?text=python&area=3&professional_role=96&order_by=publication_time
    tags: [it, ru, ekb]

  - id: hh_ekb_javascript
    kind: hh_rss
    priority: 15
    url: https://hh.ru/search/vacancy/rss?text=javascript&area=3&professional_role=96&order_by=publication_time
    tags: [it, ru, ekb]

  - id: hh_ekb_typescript
