[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Vacancy pipeline: collect postings from many sources, dedupe them, score and review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artur Stark" }]
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.18",
    "PyYAML>=6.0.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "ruff>=0.4"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
